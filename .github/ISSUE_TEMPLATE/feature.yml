name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["intake", "feature", "src:github"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would like to see and **why**. Feature requests without
        a clear use-case are hard to prioritise.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Garmin Connect IQ App
        - Web Dashboard
        - Marketing Website
        - Backend / Sync
        - Symptoms App
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Who benefits and how?
      placeholder: |
        I currently have to open the Garmin Connect app separately to check my
        HRV trend. It would be helpful to see the 7-day HRV trend directly in
        the dashboard header.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Sketch of the desired behaviour. Wireframes optional.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why this one is better.

  - type: input
    id: priority_hint
    attributes:
      label: How important is this to you?
      options:
        - "Critical — blocker for my daily workflow"
        - "High — would significantly improve my workflow"
        - "Medium — nice to have"
        - "Low — minor convenience"
